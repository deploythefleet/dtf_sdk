name: Claude Code

on:
  issues:
    types: [labeled]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'ai_task')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: next
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 100 --dangerously-skip-permissions"
          label_trigger: "ai_task"
          base_branch: "next"
          branch_prefix: "claude/"
          prompt: |                                                                                                              
              Implement the feature described in GitHub issue #${{ github.event.issue.number }} in this repository.                
              Use the GitHub MCP tools to read the full issue body.
              Read CLAUDE.md for repo conventions.                                                                                 
              Open a PR targeting the next branch.
              Use an agent team to do a thorough code review of your changes before opening the PR.
              If you are blocked, ask for help in the issue comments and label the item with "ai_blocked".
